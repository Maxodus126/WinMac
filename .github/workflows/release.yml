# Pushing a tag like v0.1.1 builds winmac.exe and publishes it as a GitHub release.
# Release notes come from the annotated tag message (git tag -a v0.1.1 -m "...").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as the README: GNU target, no Visual Studio Build Tools, no vcruntime140.dll dependency.
      - name: Install Rust (GNU)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match Cargo.toml version $ver" }

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\winmac.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so `sha256sum -c` reads it.
          [IO.File]::WriteAllText("$PWD\target\release\winmac.exe.sha256", "$hash  winmac.exe`n")

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $nsis = Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "NSIS not found" }
          & $nsis.FullName "-DROOT=$env:GITHUB_WORKSPACE" -DVERSION=$tag "tools\winmac-setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            target\release\winmac.exe target\release\winmac.exe.sha256 target\release\winmac-setup.exe `
            --title "WIN MAC $($tag.TrimStart('v'))" `
            --notes-from-tag
